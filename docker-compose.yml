services:
  neo4j:
    image: neo4j:5-community
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: '${NEO4J_USER:?set in .env}/${NEO4J_PASSWORD:?set in .env}'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:7474']
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
